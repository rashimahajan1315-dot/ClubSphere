services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - clubsphere_mongodb_data:/data/db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      MONGODB_HOST: mongodb://mongodb:27017/clubsphere
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: dev-only-change-this-secret-key
    ports:
      - "8000:8000"
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  clubsphere_mongodb_data: